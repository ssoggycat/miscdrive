name: Deploy static content to Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3.1
      - name: Install WebP
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get install -y webp
      - name: Restore webp cache
        uses: actions/cache@v4
        with:
          path: webp
          key: webp-${{ github.run_id }}
          restore-keys: |
            webp-
      - name: WebP for images
        run: |
          mkdir -p webp

          find . -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.gif' -o -iname '*.webp' -o -iname '*.bmp' \) \
            -not -path './.git/*' -not -path './.github/*' -not -path './webp/*' -print0 \
            | xargs -P 4 -0 -I {} bash -euo pipefail -c '
            src="{}"
            rel="${src#./}"
            filename=$(basename "$rel")
            dir=$(dirname "$rel")
            out="webp/$dir/${filename%.*}.webp"
            [ -f "$out" ] && exit 0
            mkdir -p "webp/$dir"
            dims=($(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of default=nw=1:nk=1 "$src"))
            width=${dims[0]}
            height=${dims[1]}
            cwebp_resize=""
            ffmpeg_resize=""
            if [[ -n "$width" && -n "$height" ]]; then
              if [ "$width" -gt 1024 ] || [ "$height" -gt 1024 ]; then
                if [ "$width" -ge "$height" ]; then
                  cwebp_resize="-resize 1024 0"
                  ffmpeg_resize="-vf scale=1024:-1"
                else
                  cwebp_resize="-resize 0 1024"
                  ffmpeg_resize="-vf scale=-1:1024"
                fi
              fi
            fi
            if ! cwebp -preset photo -mt -quiet -alpha_filter none -noalpha -sharp_yuv -q 70 $cwebp_resize "$src" -o "$out"; then
              ffmpeg -v error -i "$src" $ffmpeg_resize -quality 70 -compression_level 6 "$out"
            fi
          '
      - name: WebP thumbnails for videos
        run: |
          find . -type f \( -iname '*.mp4' -o -iname '*.webm' -o -iname '*.mov' -o -iname '*.mkv' \) \
            -not -path './.git/*' -not -path './.github/*' -not -path './webp/*' -print0 \
            | xargs -P 4 -0 -I {} bash -euo pipefail -c '
            src="{}"
            rel="${src#./}"
            filename=$(basename "$rel")
            dir=$(dirname "$rel")
            out="webp/$dir/${filename%.*}.webp"
            [ -f "$out" ] && exit 0
            mkdir -p "webp/$dir"
            dims=($(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of default=nw=1:nk=1 "$src"))
            width=${dims[0]}
            height=${dims[1]}
            resize=""
            if [[ -n "$width" && -n "$height" ]]; then
              if [ "$width" -gt 1024 ] || [ "$height" -gt 1024 ]; then
                if [ "$width" -ge "$height" ]; then
                  resize="-vf scale=1024:-1"
                else
                  resize="-vf scale=-1:1024"
                fi
              fi
            fi
            ffmpeg -y -v error -i "$src" -vframes 1 $resize -quality 70 -compression_level 6 "$out"
          '
      - name: Make lists
        run: |
          # {path, sha, size} objects: sha = git blob hash so the frontend can key
          # comments by content and survive renames, size (bytes) so it can show folder totals
          find . -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.gif' -o -iname '*.webp' -o -iname '*.bmp' \) \
            -not -path './.git/*' -not -path './.github/*' -not -path './webp/*' -print0 \
            | while IFS= read -r -d '' f; do
              rel="${f#./}"
              jq -n --arg path "$rel" --arg sha "$(git hash-object "$f")" --argjson size "$(stat -c%s "$f")" '{path:$path, sha:$sha, size:$size}'
            done | jq -s '.' > images.json
          find . -type f \( -iname '*.mp4' -o -iname '*.webm' -o -iname '*.mov' -o -iname '*.mkv' \) \
            -not -path './.git/*' -not -path './.github/*' -not -path './webp/*' -print0 \
            | while IFS= read -r -d '' f; do
              rel="${f#./}"
              jq -n --arg path "$rel" --arg sha "$(git hash-object "$f")" --argjson size "$(stat -c%s "$f")" '{path:$path, sha:$sha, size:$size}'
            done | jq -s '.' > videos.json
          jq -s 'add' images.json videos.json > all.json

          find . -type f \( -iname 'readme.md' -o -iname '.readme.md' \) \
            -not -path './.git/*' -not -path './.github/*' -not -path './webp/*' -print0 \
            | while IFS= read -r -d '' f; do
              rel="${f#./}"
              jq -n --arg path "$rel" --arg sha "$(git hash-object "$f")" --argjson size "$(stat -c%s "$f")" '{path:$path, sha:$sha, size:$size}'
            done | jq -s '.' > docs.json
      - name: Stage pages deploy
        run: |
          mkdir -p _site
          cp -r webp _site/
          cp images.json videos.json all.json docs.json _site/
          [ -f CNAME ] && cp CNAME _site/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
